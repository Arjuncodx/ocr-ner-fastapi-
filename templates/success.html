<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - OCR Elite</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        .success-icon-large {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 5rem;
            animation: bounceIn 0.6s ease;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .success-title {
            font-family: 'Sora', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }
        
        .success-message {
            font-size: 1.25rem;
            opacity: 0.95;
            margin-bottom: 3rem;
            line-height: 1.7;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-action {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: white;
        }
        
        .btn-primary-success {
            background: white;
            color: #10B981;
            border-color: white;
        }
        
        .btn-primary-success:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #10B981;
        }
        
        @media (max-width: 768px) {
            .success-title { font-size: 2.25rem; }
            .success-message { font-size: 1.1rem; }
            .action-buttons { flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon-large">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h1 class="success-title">Success!</h1>
        <p class="success-message">
            {{ message|default('Your operation completed successfully.') }}
        </p>
        <div class="action-buttons">
            <a href="/" class="btn-action btn-primary-success">
                <i class="bi bi-house-fill"></i> Back to Home
            </a>
            <a href="/ocr" class="btn-action">
                <i class="bi bi-file-earmark-text"></i> Process Document
            </a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
